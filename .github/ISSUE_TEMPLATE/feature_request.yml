name: 功能建议
description: 提出一个新功能或改进想法
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出你的想法！好的建议会帮助 Wayfinder 变得更好。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述你遇到的痛点或不便
      placeholder: 我在使用时经常觉得...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么改进？
      description: 描述你理想中的解决方案
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你目前是怎么绕过这个问题的？
      description: 如果有的话，说说你现在的替代方案
    validations:
      required: false

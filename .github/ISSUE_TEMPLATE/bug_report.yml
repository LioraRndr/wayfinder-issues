name: Bug 报告
description: 报告一个问题或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间报告问题！请尽量填写以下信息，帮助我们更快定位和修复。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要描述你遇到的问题
      placeholder: 告诉我发生了什么...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 怎样操作可以触发这个问题？
      placeholder: |
        1. 打开...
        2. 点击...
        3. 看到...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你觉得正确的表现应该是什么？
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 如果方便的话，贴一下截图
    validations:
      required: false

  - type: dropdown
    id: device
    attributes:
      label: 使用设备
      options:
        - 电脑浏览器
        - 手机浏览器
        - 其他
    validations:
      required: false
